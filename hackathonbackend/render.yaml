# render.yaml — Configuration Render pour FormaPro Backend
# Doc: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: formapro-backend
    runtime: node
    region: frankfurt  # EU pour RGPD
    plan: free         # Free tier (512MB RAM, 0.1 CPU)
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true   # Auto-deploy sur push GitHub
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Les variables suivantes doivent être renseignées
      # manuellement dans le dashboard Render ou via CLI
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
