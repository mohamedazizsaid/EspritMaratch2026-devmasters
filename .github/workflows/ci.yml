name: CI — FormaPro

on:
  push:
    branches: [aziz]
  pull_request:
    branches: [aziz]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Backend (NestJS) — Lint + Build
  # ─────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hackathonbackend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hackathonbackend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Job 2 : Frontend (React/Vite) — Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hackathonfrontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hackathonfrontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: FormaPro

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hackathonfrontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3 : Déploiement automatique (Render & Vercel)
  # Déclenché UNIQUEMENT si Backend CI ET Frontend CI ont réussi !
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Render & Vercel
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aziz')

    steps:
      - name: Trigger Render Deploy Hook (Backend)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL non configuré dans les secrets GitHub."
          else
            echo "🚀 Déclenchement du déploiement Render..."
            curl -s -S -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Signal de déploiement envoyé à Render !"
          fi

      - name: Trigger Vercel Deploy Hook (Frontend)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL non configuré dans les secrets GitHub."
          else
            echo "🚀 Déclenchement du déploiement Vercel..."
            curl -s -S -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "✅ Signal de déploiement envoyé à Vercel !"
          fi
