name: CI — FormaPro

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Backend (NestJS) — Lint + Build
  # ─────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hackathonbackend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hackathonbackend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Job 2 : Frontend (React/Vite) — Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hackathonfrontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hackathonfrontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: FormaPro

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hackathonfrontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3 : Notification de succès
  # ─────────────────────────────────────────────
  notify:
    name: Notify Deploy Ready
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: CI passed — Render & Vercel will auto-deploy
        run: |
          echo "✅ Backend build OK"
          echo "✅ Frontend build OK"
          echo "🚀 Render détecte automatiquement le push et déploie le backend"
          echo "🚀 Vercel détecte automatiquement le push et déploie le frontend"
